{% extends "base.html" %}
{% block title %}Login – StudyMate AI{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card"><div class="card-body p-4 p-md-5">
    <h3 class="fw-bold mb-1">Welcome back</h3>
    <p class="text-secondary mb-4">Log in to see today's study plan.</p>
    <form method="post" novalidate>
      <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div>
      <div class="mb-4"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
      <div class="d-grid gap-2">
        <button class="btn btn-brand">Login</button>
        <a class="btn btn-outline-brand" href="{{ url_for('register') }}">Create Account</a>
      </div>
    </form>
  </div></div>
</div>
{% endblock %}
